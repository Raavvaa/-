 const at=audioTime(offset),src=AC.createBufferSource(),filt=AC.createBiquadFilter(),gain=AC.createGain();src.buffer=noiseBuffer;src.loop=true;filt.type=type;filt.Q.value=.85;
 filt.frequency.setValueAtTime(f0,at);filt.frequency.exponentialRampToValueAtTime(f1,at+dur);
 env(gain,at,attack,dur,vol);src.connect(filt).connect(gain).connect(panner(pan));src.start(at);src.stop(at+dur+.035);
}
function pad(freq,offset=0,vol=.024,dur=3.0,pan=0){if(!audio||audio.state!=='running')return;
 const at=audioTime(offset),osc=AC.createOscillator(),gain=AC.createGain();osc.type='sine';osc.frequency.value=freq;
 env(gain,at,.56,dur,vol);osc.connect(gain).connect(panner(pan));osc.start(at);osc.stop(at+dur+.05);
}
function note(i){const pent=[0,2,4,7,9],oct=Math.floor(i/5),mod=((i%5)+5)%5;return 523.25*Math.pow(2,(pent[mod]+12*oct)/12);}
function knock(i,offset){glide(165+i*25,75+i*15,.105,offset,.038,'triangle');noise(3400,1600,.05,offset,.016,0,'bandpass',.004);}
function sleigh(offset,strength){noise(6600,5700,.092,offset,.024*strength,0,'bandpass',.003);for(let j=0;j<4;j++)bell(note(9+j)*(.991+j*.006),offset+j*.015,.008*strength,.26,j%2?.65:-.65);}
let fired=new Set(),growthSoundStep=-1,grainStep=-1;
function doCue(name){
 if(fired.has(name)||!audio||audio.state!=='running')return;
 fired.add(name);
 switch(name){
  case 'drop':glide(2400,620,.34,0,.036);bell(note(11),0,.034,.8);break;
  case 'land':glide(120,44,.30,0,.12);noise(370,3900,1.2,0,.06,0,'bandpass',.10);
    bell(note(-10),0,.064,2.2,-.5);bell(note(-7),.05,.065,2.3,.5);
    for(let j=0;j<3;j++)bell(note(8+j),.18+j*.13,.035,.57,-.7+j*.7);break;
  case 'trunk':for(let j=0;j<6;j++)knock(j,j*.067);break;
  case 'ring':noise(500,5300,.60,0,.072,0,'bandpass',.06);glide(330,990,.60,0,.036);bell(note(9),.58,.047,1.1);break;
  case 'star':for(let j=0;j<5;j++)bell(note(4+j),j*.075,.045,1.5,mix(-.7,.7,j/4));
    for(let j=0;j<4;j++)bell(note([5,7,9,11][j]),.38,.077,2.7,[-.8,.8,-.3,.3][j]);
    noise(4600,9200,1.25,.38,.036,0,'bandpass',.018);break;
  case 'comets':noise(9500,850,2.7,0,.065,0,'bandpass',.02);
    for(let j=0;j<24;j++)bell(note(14-j),j*3/24,.032,.68,j%2?.9:-.9);break;
  case 'alllit':for(let j=0;j<4;j++)pad(note([-5,-3,-1,0][j]),0,.026,3.05,[-.8,-.35,.35,.8][j]);bell(note(9),0,.063,2.2);break;
  case 'deer':for(let j=0;j<7;j++)bell(note(5+j),j*.085,.043,1.0,mix(-.9,.9,j/6));
    for(let j=0;j<8;j++)sleigh(.64+j*.17,1-j*.095);break;
 }
}
const timeline=[[.05,'drop'],[.39,'land'],[1.05,'trunk'],[1.2,'ring'],[5.27,'star'],[5.95,'comets'],[8.95,'alllit'],[10.55,'deer']];
function cuesBetween(old,now){
 if(!audio||audio.state!=='running')return;
 for(const [when,name]of timeline)if(old<when&&now>=when)doCue(name);
 for(let i=0;i<5;i++){
  const when=9.05+i*.26,name='gift'+i;
  if(old<when&&now>=when&&!fired.has(name)){
   fired.add(name);glide(245+i*36,(245+i*36)*3.2,.075,0,.036);
   noise(3200,4200,.08,0,.024,0,'bandpass',.005);bell(note(5+i),.055,.054,.75,mix(-.7,.7,i/4));
  }
 }
 if(now>=1.8&&old<5.4){
  const current=Math.min(39,Math.floor(clamp((now-1.8)/3.6)*40));
  for(let i=growthSoundStep+1;i<=current;i++){
   if(hash(i,13,57)<.75)bell(note(10+Math.floor(hash(i,4,33)*10)),0,.008+hash(i,7,2)*.013,.65,hash(i,2,17)*2-1);
  }
  growthSoundStep=current;
  const grain=Math.min(37,Math.floor((now-1.8)/.095));
  for(let j=grainStep+1;j<=grain;j++){
   const flutter=.5+.5*hash(j,5,9),swell=Math.sin(Math.PI*clamp((j*.095)/3.6));
   noise(2600+1000*hash(j,8,3),3300,.11,0,.005+.012*flutter*swell,hash(j,3,1)*2-1,'bandpass',.018);
   noise(6200,5800,.09,0,.003+.008*flutter*swell,.5-hash(j,1,4),'bandpass',.012);
  }
  grainStep=grain;
 }
}
function reset(){filmT=0;quality=1;frameStats=0;frameTimes=0;fired.clear();growthSoundStep=-1;grainStep=-1;state='playing';
 if(!AC)setupAudio();else AC.resume().catch(()=>{});
}
function onTap(){if(state==='ready'||state==='hold'){reset();canvas.focus({preventScroll:true});}}
canvas.addEventListener('pointerdown',onTap,{passive:true});
window.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();if(state==='ready'){reset();return;}
  if(state==='playing'){state='paused';if(AC&&AC.state==='running')AC.suspend();}
  else if(state==='paused'){state='playing';if(AC)AC.resume();}else if(state==='hold')reset();
 }else if(e.code==='Enter'){if(state==='ready'||state==='hold')reset();}
 else if(e.code==='KeyR'){reset();}
});
window.addEventListener('resize',layout,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){state='paused';if(AC&&AC.state==='running')AC.suspend();}});
layout();requestAnimationFrame(frame);
})();
</script>
