name: Publish Baku ASCII Website
on:
  workflow_dispatch:
  push:
    paths:
      - baku/index.html
      - .github/workflows/publish-baku.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Baku website
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 -X POST 'https://ship.page/deploy' -H 'Content-Type: text/html' --data-binary @baku/index.html)"
          url="$(printf '%s' "$response" | jq -er '.url')"
          case "$url" in
            https://*.ship.place/) ;;
            *) echo "Unexpected deployment URL"; exit 1 ;;
          esac
          printf '%s\n' "$url" > baku/LIVE_URL.txt
          echo "Live Baku URL: $url"
      - name: Record published link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baku/LIVE_URL.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record Baku website link [skip ci]'
          git push
