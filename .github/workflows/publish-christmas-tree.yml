name: Publish Christmas Tree
on:
  workflow_dispatch:
  push:
    paths:
      - christmas-tree/index.html
      - .github/workflows/publish-christmas-tree.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish static HTML for public viewing
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 2 -X POST 'https://ship.page/deploy' -H 'Content-Type: text/html' --data-binary @christmas-tree/index.html)"
          url="$(printf '%s' "$response" | jq -er '.url')"
          case "$url" in
            https://*.ship.place/) ;;
            *) echo "Unexpected publish URL"; exit 1 ;;
          esac
          echo "Published: $url"
          printf '%s\n' "$url" > christmas-tree/LIVE_URL.txt
      - name: Save public link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add christmas-tree/LIVE_URL.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record deployed Christmas tree URL [skip ci]'
          git push
